{% extends 'layout.html' %}

{% block content %}

<div class="container mt-4">
<div class="main-container">
    <div class="page-header">
        <h1 class="page-title">
            <i class="bi bi-clipboard2-data"></i> 管理员列表
        </h1>
        <a class="btn btn-success" href="/admin/add/">
            <i class="bi bi-plus-circle"></i> 新建管理员
        </a>
        <form method='get' class="d-flex" role="search">
        <input class="form-control me-2" name='q' type="text" placeholder="搜索"  value='{{ search_data }}'/>
        <button class="btn btn-outline-success" type="submit">搜索</button>
      </form>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>密码</th>
                    <th>重置密码</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
            {% for obj in queryset %}
                <tr>
                    <td>{{ obj.id }}</td>
                    <td>{{ obj.username }}</td>
                    <td>******</td>
                    <td>
                        <a href="/admin/{{ obj.id }}/reset/">重置密码</a>
                    </td>
                    <td>
                        <a class="btn btn-primary btn-sm me-1" href="/admin/{{ obj.id }}/edit/">
                            <i class="bi bi-pencil-square"></i> 编辑
                        </a>
                        <a class="btn btn-danger btn-sm" href="/admin/{{ obj.id }}/delete/">
                            <i class="bi bi-trash"></i> 删除
                        </a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

    <nav aria-label="Page navigation" class="mt-4">
        <!-- 分页导航 -->
        {% if page_string %}
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                {{ page_string }}
            </ul>
        </nav>
        {% endif %}
    </nav>
</div>
</div>

{% endblock %}
