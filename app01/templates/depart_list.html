{% extends 'layout.html' %}

{% block content %}

<div class="container mt-4">
<div class="main-container">
    <div class="page-header">
        <h1 class="page-title">
            <i class="bi bi-clipboard2-data"></i> 部门列表
        </h1>
        <a class="btn btn-success" href="/depart/add/">
            <i class="bi bi-plus-circle"></i> 新建部门
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th width="15%">ID</th>
                    <th width="55%">部门名称</th>
                    <th width="30%">操作</th>
                </tr>
            </thead>
            <tbody>
            {% for obj in queryset %}
                <tr>
                    <td>{{ obj.id }}</td>
                    <td>{{ obj.title }}</td>
                    <td>
                        <a class="btn btn-primary btn-sm me-1" href="/depart/{{ obj.id }}/edit/">
                            <i class="bi bi-pencil-square"></i> 编辑
                        </a>
                        <a class="btn btn-danger btn-sm" href="/depart/delete/?nid={{ obj.id }}">
                            <i class="bi bi-trash"></i> 删除
                        </a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

    {% if page_string %}
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            {{ page_string }}
        </ul>
    </nav>
    {% endif %}
</div>
</div>

{% endblock %}
