{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>联通用户管理系统</title>
    {% block css %}{% endblock %}
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-5.3.7/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- 添加Bootstrap Datepicker CSS -->
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-datepicker/css/bootstrap-datepicker.min.css' %}">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
            border-radius: 0;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .main-container {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,.05);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--primary-color);
        }

        .table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .table-hover tbody tr:hover {
            background-color: rgba(13, 110, 253, 0.05);
        }

        .btn-xs {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            line-height: 1.5;
            border-radius: 0.2rem;
        }

        .dropdown-menu {
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }

        .nav-link {
            font-weight: 500;
        }

        /* 日期选择器自定义样式 */
        .datepicker {
            border-radius: 0.375rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .datepicker-dropdown:after {
            border-bottom-color: #fff;
        }
        .datepicker table tr td.active.active {
            background-color: var(--primary-color);
        }
        .input-group.date .input-group-text {
            cursor: pointer;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">
        <i class="bi bi-building"></i> 联通用户管理系统
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="/depart/list/">
            <i class="bi bi-people-fill"></i> 部门管理
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/admin/list/">
            <i class="bi bi-people-fill"></i> 管理员账户
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/user/list/">
            <i class="bi bi-people-fill"></i> 用户管理
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/pretty/list/">
            <i class="bi bi-people-fill"></i> 靓号管理
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/task/list/">
            <i class="bi bi-people-fill"></i> 任务管理
          </a>
        </li>
          <li class="nav-item">
          <a class="nav-link active" href="/order/list/">
            <i class="bi bi-people-fill"></i> 订单管理
          </a>
        </li>
        </li>
          <li class="nav-item">
          <a class="nav-link active" href="/chart/list/">
            <i class="bi bi-people-fill"></i> 数据统计
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">
            <i class="bi bi-link-45deg"></i> 其他功能
          </a>
        </li>
      </ul>

      <!-- 右侧导航项 -->
      <ul class="navbar-nav">

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i> {{ request.session.info.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">
                <i class="bi bi-person-lines-fill me-2"></i>个人资料
            </a></li>
            <li><a class="dropdown-item" href="#">
                <i class="bi bi-info-circle me-2"></i>我的信息
            </a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="/logout/">
                <i class="bi bi-box-arrow-right me-2"></i>注销
            </a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap-5.3.7/js/bootstrap.bundle.min.js' %}"></script>
<!-- 添加Bootstrap Datepicker JS -->
<script src="{% static 'plugins/bootstrap-datepicker/js/bootstrap-datepicker.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap-datepicker/locales/bootstrap-datepicker.zh-CN.min.js' %}"></script>
<script>
// 全局日期选择器初始化
$(document).ready(function(){
    $('.datepicker').datepicker({
        format: 'yyyy-mm-dd',
        language: 'zh-CN',
        autoclose: true,
        todayHighlight: true,
        orientation: 'auto'
    });
});
</script>
{% block js %}{% endblock %}
</body>
</html>
