{% extends 'layout.html' %}

{% block content %}
    <div class="container">
        <form method='post' novalidate class="row g-3 needs-validation" novalidate>
            {% csrf_token %}

      {% for field in form %}
        <div class="form-group">
            <label>{{field.label}}</label>
            {{field}}
            <span style="color:red ">{{ field.errors.0 }}</span>
        </div>
      {% endfor %}

  <div class="col-12">
    <button class="btn btn-primary" type="submit">提 交</button>
  </div>
        </form>
    </div>
{% endblock %}
